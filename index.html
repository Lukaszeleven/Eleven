<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჩემი ონლაინ მაღაზია</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- საიტის ქუდი / სათაური -->
    <header>
        <h1>ონლაინ მაღაზია</h1>
        <div class="cart-status">
            🛒 კალათა: <span id="cart-count">0</span> ნივთი | ჯამი: <span id="cart-total">0</span> ₾
        </div>
    </header>

    <!-- მთავარი კონტენტი: პროდუქტების კატალოგი -->
    <main>
        <h2>პროდუქცია</h2>
        <div id="products-container" class="products-grid">
            <!-- აქ ავტომატურად გამოჩნდება პროდუქტები JavaScript-ის მეშვეობით -->
        </div>
    </main>

    <!-- კალათის სექცია -->
    <section class="cart-section">
        <h2>შენი კალათა</h2>
        <ul id="cart-items-list">
            <!-- აქ გამოჩნდება კალათაში დამატებული ნივთები -->
        </ul>
        <button id="checkout-btn" onclick="checkout()">შეკვეთის გაფორმება</button>
    </section>

    <!-- JavaScript ფაილის მიერთება -->
    <script src="app.js"></script>
</body>
</html>
