<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELEVEN — Sports Store</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="#" class="logo">ELEVEN</a>
            <div class="cart-badge" onclick="toggleCartModal()">
                🛒 <span>კალათა:</span> <strong id="cart-count">0</strong> ნივთი (<span id="cart-total">0</span> ₾)
            </div>
        </div>
    </header>

    <!-- Hero / Banner -->
    <section class="hero">
        <div class="container hero-content">
            <h1>აღმოაჩინე საუკეთესო საფეხბურთო მაისურები</h1>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container">
        <h2 class="section-title">პროდუქცია</h2>
        <div id="products-container" class="products-grid">
            <p class="loading-text">პროდუქტები იტვირთება...</p>
        </div>
    </main>

    <!-- Cart Modal / Sidebar Panel -->
    <div id="cart-modal" class="cart-modal">
        <div class="cart-modal-content">
            <div class="cart-header">
                <h3>შენი კალათა</h3>
                <button class="close-btn" onclick="toggleCartModal()">&times;</button>
            </div>
            <ul id="cart-items-list" class="cart-items"></ul>
            <div class="cart-footer">
                <div class="cart-total-text">
                    <span>სულ ჯამი:</span>
                    <strong><span id="modal-cart-total">0</span> ₾</strong>
                </div>
                <button class="checkout-btn" onclick="checkout()">შეკვეთის გაფორმება</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 ELEVEN. ყველა უფლება დაცულია.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
