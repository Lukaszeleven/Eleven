<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ELEVEN — საფეხბურთო მაისურები">
    <title>ELEVEN — Sports Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="#" class="logo">ELEVEN</a>
            <button class="cart-badge" onclick="toggleCartModal()" aria-label="კალათის გახსნა">
                🛒 <span class="cart-label">კალათა:</span> <strong id="cart-count">0</strong> ნივთი (<span id="cart-total">0</span> ₾)
            </button>
        </div>
    </header>

    <section class="hero">
        <span class="hero-number" aria-hidden="true">11</span>
        <div class="container hero-content">
            <h1>საუკეთესო საფეხბურთო მაისურები</h1>
            <p>აირჩიე მაისური, დაამატე კალათაში და შეკვეთა WhatsApp-ით გააფორმე.</p>
            <a href="#products" class="hero-cta">იხილე პროდუქცია</a>
        </div>
    </section>

    <main class="container" id="products">
        <div class="toolbar">
            <h2 class="section-title">პროდუქცია</h2>
            <input id="search" type="search" placeholder="მოძებნე მაისური..." aria-label="ძებნა">
        </div>
        <div id="products-container" class="products-grid">
            <p class="loading-text">პროდუქტები იტვირთება...</p>
        </div>
    </main>

    <div id="cart-modal" class="cart-modal">
        <div class="cart-modal-content">
            <div class="cart-header">
                <h3>შენი კალათა</h3>
                <button class="close-btn" onclick="toggleCartModal()" aria-label="დახურვა">&times;</button>
            </div>
            <ul id="cart-items-list" class="cart-items"></ul>
            <div class="cart-footer">
                <div class="order-form">
                    <input id="order-name" type="text" placeholder="სახელი და გვარი" autocomplete="name">
                    <input id="order-phone" type="tel" placeholder="ტელეფონი" autocomplete="tel">
                    <input id="order-address" type="text" placeholder="მისამართი" autocomplete="street-address">
                </div>
                <div class="cart-total-text">
                    <span>სულ ჯამი</span>
                    <strong><span id="modal-cart-total">0</span> ₾</strong>
                </div>
                <button class="checkout-btn" onclick="checkout()">შეკვეთის გაგზავნა WhatsApp-ით</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="container footer-content">
            <span class="logo">ELEVEN</span>
            <p>&copy; 2026 ELEVEN. ყველა უფლება დაცულია.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
